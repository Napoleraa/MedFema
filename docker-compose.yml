services:
  mysql:
    image: mysql:8.4
    container_name: medfema-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: medfema
      MYSQL_USER: medfema
      MYSQL_PASSWORD: medfema123
      MYSQL_ROOT_PASSWORD: root123
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - medfema_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umedfema", "-pmedfema123"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  medfema_mysql:
